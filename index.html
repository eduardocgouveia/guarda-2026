<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)">
<title>Guarda Joaquim</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F2F2F7;
  --blob1:rgba(191,90,242,.30);--blob2:rgba(10,132,255,.26);--blob3:rgba(255,159,10,.14);
  --glass:rgba(255,255,255,.56);--glass-strong:rgba(255,255,255,.82);--glass-sheet:rgba(250,250,252,.95);
  --glass-border:rgba(255,255,255,.75);
  --hi:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 .5px rgba(255,255,255,.4);
  --shadow:0 10px 40px rgba(30,30,60,.08);
  --hairline:rgba(60,60,67,.12);
  --text:#1C1C1E;--text2:rgba(60,60,67,.64);--text3:rgba(60,60,67,.36);
  --mae:#A445DB;--mae-fill:rgba(175,82,222,.14);
  --pai:#0A6CDB;--pai-fill:rgba(0,122,255,.12);
  --shared:#C47A00;--shared-fill:rgba(255,159,10,.16);
  --accent:#FF9500;--ok:#28A745;--bad:#FF3B30;
  --ease:cubic-bezier(.32,.72,0,1);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B0B0F;
  --blob1:rgba(191,90,242,.28);--blob2:rgba(10,132,255,.24);--blob3:rgba(255,159,10,.08);
  --glass:rgba(44,44,50,.52);--glass-strong:rgba(255,255,255,.14);--glass-sheet:rgba(32,32,36,.95);
  --glass-border:rgba(255,255,255,.09);
  --hi:inset 0 1px 0 rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.05);
  --shadow:0 10px 40px rgba(0,0,0,.35);
  --hairline:rgba(120,120,128,.24);
  --text:#F5F5F7;--text2:rgba(235,235,245,.62);--text3:rgba(235,235,245,.3);
  --mae:#D08CFF;--mae-fill:rgba(191,90,242,.22);
  --pai:#5AA9FF;--pai-fill:rgba(10,132,255,.22);
  --shared:#FFB340;--shared-fill:rgba(255,159,10,.2);
  --ok:#32D74B;--bad:#FF453A;
}}
html{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;-webkit-font-smoothing:antialiased;letter-spacing:-.01em;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:default}

.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);width:75vw;height:75vw;max-width:440px;max-height:440px}
.bg i:nth-child(1){background:var(--blob1);top:-14%;left:-22%}
.bg i:nth-child(2){background:var(--blob2);top:38%;right:-28%}
.bg i:nth-child(3){background:var(--blob3);bottom:-12%;left:2%}

.wrap{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 112px)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--hi),var(--shadow)}
.card{border-radius:28px;padding:18px;margin-bottom:14px}
.muted{color:var(--text2);font-size:13px}

.top{display:flex;justify-content:space-between;align-items:flex-end;padding:10px 4px 18px}
.eyebrow{font-size:13px;font-weight:600;color:var(--text2)}
h1{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.year{display:flex;align-items:center;border-radius:999px;padding:3px}
.year span{font-weight:600;font-size:15px;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}
.year button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:background .2s,transform .25s var(--ease)}
.year button:active{background:var(--hairline);transform:scale(.88)}
.year button:disabled{opacity:.25}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--text2)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s}
.sync.online .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(40,167,69,.18)}
.sync.loading .dot{background:var(--accent);animation:pulse 1.2s infinite}
.sync.offline .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}

.bal-head{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600;margin-bottom:14px}
.bal-head .muted{font-weight:400}
.bal-nums{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bal{border-radius:20px;padding:14px}
.bal.mae{background:var(--mae-fill)}.bal.pai{background:var(--pai-fill)}
.bal b{display:block;font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1;font-variant-numeric:tabular-nums}
.bal.mae b{color:var(--mae)}.bal.pai b{color:var(--pai)}
.bal span{display:block;font-size:13px;color:var(--text2);margin-top:6px}
.bal em{font-style:normal;font-size:12px;font-weight:600;display:block;margin-top:2px}
.up{color:var(--ok)}.down{color:var(--bad)}
.bar{display:flex;gap:3px;height:6px;margin:14px 0 10px}
.bar i{display:block;height:100%;border-radius:99px;transition:width .6s var(--ease)}
.bar .mae{background:var(--mae)}.bar .pai{background:var(--pai)}.bar .shared{background:var(--shared)}
.bal-foot{font-size:13px;color:var(--text2)}
.bal-foot.warn{color:var(--accent)}

.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h2{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
.nav{display:flex;gap:8px}
.circle{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--glass-strong);border:1px solid var(--glass-border);box-shadow:var(--hi),0 2px 8px rgba(0,0,0,.06);transition:transform .3s var(--ease)}
.circle:active{transform:scale(.86)}
.circle:disabled{opacity:.3}
.note{font-size:13px;padding:10px 12px;border-radius:14px;background:var(--hairline);margin-bottom:12px;line-height:1.4}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk span{text-align:center;font-size:11px;font-weight:600;color:var(--text3);padding-bottom:6px}
.grid{touch-action:pan-y}
.d{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;position:relative;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;transition:transform .3s var(--ease),background .3s}
.d:active{transform:scale(.88)}
.d.mae{background:var(--mae-fill);color:var(--mae)}
.d.pai{background:var(--pai-fill);color:var(--pai)}
.d.shared{background:var(--shared-fill);color:var(--shared)}
.d.off{color:var(--text3);font-weight:500;opacity:.6}
.d.today{color:#fff}
.d.today.mae{background:var(--mae);box-shadow:0 8px 18px -8px var(--mae)}
.d.today.pai{background:var(--pai);box-shadow:0 8px 18px -8px var(--pai)}
.d.today.shared{background:var(--shared);box-shadow:0 8px 18px -8px var(--shared)}
.d.sel{outline:2px solid var(--text);outline-offset:2px}
.d .hol{position:absolute;bottom:6px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.d.today .hol{background:#fff}
.d .chg{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center;margin-top:16px;font-size:12px;color:var(--text2)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:4px}
.sw.mae{background:var(--mae)}.sw.pai{background:var(--pai)}
.pt{width:6px;height:6px;border-radius:50%}
.pt.hol{background:var(--accent)}.pt.chg{background:var(--text2)}
.slide-l{animation:slideL .45s var(--ease)}
.slide-r{animation:slideR .45s var(--ease)}
@keyframes slideL{from{opacity:0;transform:translateX(32px)}}
@keyframes slideR{from{opacity:0;transform:translateX(-32px)}}
.enter>*{animation:enter .5s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}
@keyframes enter{from{opacity:0;transform:translateY(12px)}}

.rules summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;cursor:pointer}
.rules summary::-webkit-details-marker{display:none}
.rules summary svg{transition:transform .35s var(--ease);color:var(--text3)}
.rules[open] summary svg{transform:rotate(90deg)}
.rules dl{margin-top:10px}
.rules dl div{display:flex;justify-content:space-between;gap:14px;padding:11px 0;border-top:.5px solid var(--hairline);font-size:14px}
.rules dt{color:var(--text2)}
.rules dd{text-align:right;font-weight:500}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:0 4px 16px}
.page-head .muted{margin-top:4px}
.group-label{font-size:14px;font-weight:600;color:var(--text2);padding:4px 18px 8px}
.list{border-radius:22px;overflow:hidden;margin-bottom:18px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px;position:relative;transition:background .2s}
.row+.row::before{content:'';position:absolute;top:0;left:72px;right:0;height:.5px;background:var(--hairline)}
.row:active{background:var(--hairline)}
.row.past{opacity:.45}
.date{width:42px;text-align:center;flex-shrink:0}
.date b{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.date span{font-size:11px;color:var(--text2);font-weight:500}
.row-main{flex:1;min-width:0}
.row-main p{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main .muted{font-size:12px;margin-top:1px}
.tag{font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;white-space:nowrap;flex-shrink:0}
.tag.mae{background:var(--mae-fill);color:var(--mae)}
.tag.pai{background:var(--pai-fill);color:var(--pai)}
.tag.shared{background:var(--shared-fill);color:var(--shared)}
.link{font-size:15px;color:var(--bad);font-weight:500;padding:4px 0}
.small-btn{font-size:13px;font-weight:600;padding:7px 12px;border-radius:99px;background:var(--hairline);flex-shrink:0;transition:transform .25s var(--ease)}
.small-btn:active{transform:scale(.94)}
.empty{text-align:center;padding:40px 24px}
.empty h3{margin-bottom:8px}
.empty p{font-size:14px;color:var(--text2);line-height:1.5}
.impact{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.impact .bal b{font-size:26px}
.warn-line{margin-top:12px;font-size:13px;color:var(--bad)}

.tabbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);width:min(340px,calc(100% - 48px));border-radius:999px;padding:6px;display:flex;z-index:20}
.tabbar .pill{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/3);border-radius:999px;background:var(--glass-strong);box-shadow:var(--hi),0 2px 12px rgba(0,0,0,.08);transition:transform .55s cubic-bezier(.34,1.45,.5,1)}
.tabbar button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:11px;font-weight:600;color:var(--text2);transition:color .3s,transform .3s var(--ease)}
.tabbar button:active{transform:scale(.92)}
.tabbar button.active{color:var(--text)}
.tabbar svg{width:22px;height:22px}
.badge{position:absolute;top:1px;left:calc(50% + 7px);min-width:17px;height:17px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .4s;z-index:30}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);max-width:504px;margin:0 auto;border-radius:34px;padding:10px 20px 18px;z-index:31;background:var(--glass-sheet);transform:translateY(calc(100% + 40px));transition:transform .55s var(--ease)}
.sheet.open{transform:none}
.grab{width:36px;height:5px;border-radius:99px;background:var(--text3);margin:0 auto 16px}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h3{font-size:21px;font-weight:700;letter-spacing:-.025em}
.sh-hol{margin-top:14px;font-size:15px;font-weight:600;color:var(--accent)}
.sh-note{margin-top:6px;font-size:14px;color:var(--text2)}
.sh-chg{margin-top:4px;font-size:13px;color:var(--text2)}
.sh-actions{display:grid;gap:8px;margin-top:20px}
.sh-actions .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{height:52px;border-radius:99px;font-size:16px;font-weight:600;transition:transform .3s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.mae{background:var(--mae);color:#fff}
.btn.pai{background:var(--pai);color:#fff}
.btn.ghost{background:var(--hairline);color:var(--text)}

.toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translate(-50%,-160%);padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;z-index:50;transition:transform .55s var(--ease);white-space:nowrap}
.toast.show{transform:translate(-50%,0)}

.who{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:24px;background:rgba(0,0,0,.3)}
.who.open{display:grid}
.who-card{border-radius:34px;padding:28px 22px 22px;width:100%;max-width:360px;text-align:center;background:var(--glass-sheet)}
.who-card p{margin-top:6px}
.who-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}

:root{--aviso:#0E9F96}
@media (prefers-color-scheme:dark){:root{--aviso:#40C8C0}}
.d .dots{position:absolute;bottom:5px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.d .dots i{width:4px;height:4px;border-radius:50%}
.d .dots .h{background:var(--accent)}.d .dots .a{background:var(--aviso)}
.d.today .dots i{background:#fff}
.pt.av{background:var(--aviso)}
.av-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.av-head span{font-size:15px;font-weight:600}
.add-btn{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--aviso);padding:6px 12px 6px 8px;border-radius:99px;background:rgba(14,159,150,.12);transition:transform .25s var(--ease)}
.add-btn:active{transform:scale(.94)}
.av-row{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:.5px solid var(--hairline);width:100%;text-align:left}
.av-list .av-row:first-child{border-top:0}
.av-when{width:58px;flex-shrink:0}
.av-when b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em}
.av-when span{font-size:12px;color:var(--text2)}
.av-main{flex:1;min-width:0}
.av-main p{font-size:15px;font-weight:500;line-height:1.3;word-wrap:break-word}
.av-meta{font-size:12px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tp{display:inline-flex;align-items:center;gap:4px}
.tp::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tp)}
.tp.escola{--tp:#5856D6}.tp.saude{--tp:#FF3B30}.tp.festa{--tp:#FF2D55}.tp.casa{--tp:#34C759}.tp.outro{--tp:var(--text3)}
.av-empty{font-size:14px;color:var(--text2);padding:6px 0 2px;line-height:1.45}
.av-more{font-size:13px;color:var(--text2);padding-top:8px}
.push-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--hairline);font-size:13px;color:var(--text2);line-height:1.35}
.push-row b{font-weight:600;display:block;font-size:14px;color:var(--text);margin-bottom:2px}
.push-row .small-btn{background:var(--aviso);color:#fff}
.sh-avisos{margin-top:12px}
.x{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text3);flex-shrink:0}
.x:active{background:var(--hairline)}
.f-label{font-size:13px;font-weight:600;color:var(--text2);margin:16px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:99px;font-size:14px;font-weight:500;background:var(--hairline);transition:background .2s,color .2s}
.chip.on{background:var(--text);color:var(--bg)}
.field{display:block;width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--hairline);border:0;border-radius:14px;padding:12px 14px;min-height:46px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{box-shadow:0 0 0 2px var(--aviso)}
.f-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.f-row small{display:block;font-size:12px;color:var(--text2);margin:0 0 6px 4px}
.toggle{display:flex;align-items:center;justify-content:space-between;margin-top:16px;font-size:15px}
.sw-t{width:51px;height:31px;border-radius:99px;background:var(--hairline);position:relative;transition:background .3s;flex-shrink:0}
.sw-t::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .35s var(--ease)}
.sw-t.on{background:var(--ok)}.sw-t.on::after{transform:translateX(20px)}
.btn.av{background:var(--aviso);color:#fff}
.btn.av-ghost{background:rgba(14,159,150,.12);color:var(--aviso)}
.btn:disabled{opacity:.5}
.sheet{max-height:calc(100dvh - env(safe-area-inset-top) - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.prox{border-radius:22px;padding:4px 16px;margin-bottom:14px}
.prox-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 0;border-top:.5px solid var(--hairline);font-size:15px}
.prox-row:first-child{border-top:0}
.prox-row .when{width:68px;flex-shrink:0;font-size:13px;font-weight:600;color:var(--aviso)}
.prox-row .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.prox-row .t .tp{vertical-align:middle}
.prox-row .hr{font-size:13px;color:var(--text2);font-variant-numeric:tabular-nums}
.top-meta{display:flex;align-items:center;gap:10px}
.bell{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text2);transition:transform .25s var(--ease),background .2s}
.bell:active{transform:scale(.88);background:var(--hairline)}
.bell.on{color:var(--aviso)}
.bell svg{width:19px;height:19px}
.av-sub{font-size:13px;font-weight:600;color:var(--text2);margin:14px 0 2px}
.av-row>.av-main+.x{margin-top:-2px}
.del-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.small-btn.danger{background:rgba(255,59,48,.12);color:var(--bad)}
.tp.atividade{--tp:#FF9500}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--hairline);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:9px 4px;border-radius:9px;font-size:14px;font-weight:500;color:var(--text2);transition:background .25s,color .25s}
.seg button.on{background:var(--glass-strong);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.chip.day{width:40px;padding:8px 0;text-align:center}
.toggle small{display:block;font-size:12px;color:var(--text2);margin-top:2px;padding-right:12px}
.f-row label{min-width:0;display:block}
.field{min-width:0;max-width:100%}
input[type=date].field,input[type=time].field{font-size:15px;padding:12px 10px}

<script>
const R="Raquel",E="Eduardo",S="Compartilhado";
const MO=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DA=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];

// ===== STATE =====
let year=new Date().getFullYear();
if(year<2026)year=2026;
let tab='cal',month=0,editing=null;
let syncState='loading';
let db=null;
let BASE={},NOTES={},HOL={};
let schedule={},changes={};

// ===== DATE HELPERS =====
function dk(y,m,d){return`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function dim(y,m){return new Date(y,m+1,0).getDate()}
function gdow(y,m,d){return new Date(y,m,d).getDay()}
function today(){const n=new Date();return dk(n.getFullYear(),n.getMonth(),n.getDate())}
function getStart(){return year===2026?"2026-04-10":dk(year,0,1)}
function getEnd(){return dk(year,11,31)}
function inR(k){return k>=getStart()&&k<=getEnd()}
function getMinMonth(){return year===2026?3:0}

// ===== EASTER & MOVABLE HOLIDAYS =====
function easterDate(y){
  const a=y%19,b=Math.floor(y/100),c=y%100;
  const d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4),k2=c%4;
  const l=(32+2*e+2*i-h-k2)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const mo=Math.floor((h+l-7*m+114)/31)-1;
  const da=((h+l-7*m+114)%31)+1;
  return{month:mo,day:da};
}
function dateAdd(y,m,d,days){const dt=new Date(y,m,d+days);return{month:dt.getMonth(),day:dt.getDate()}}
function nthSunday(y,m,n){const d1=new Date(y,m,1).getDay();const first=d1===0?1:8-d1;return first+7*(n-1)}

// ===== BUILD HOLIDAYS FOR YEAR =====
function buildHolidays(y){
  const e=easterDate(y);
  const carTer=dateAdd(y,e.month,e.day,-47);
  const carSeg=dateAdd(y,e.month,e.day,-48);
  const sextaSanta=dateAdd(y,e.month,e.day,-2);
  const cc=dateAdd(y,e.month,e.day,60);
  const dMae=nthSunday(y,4,2);
  const dPai=nthSunday(y,7,2);
  const hol={};
  function add(m,d,name,type){hol[dk(y,m,d)]={name,type}}
  add(0,1,"Ano Novo","Nacional");
  add(carSeg.month,carSeg.day,"Carnaval (Seg)","Facultativo");
  add(carTer.month,carTer.day,"Carnaval (Ter)","Facultativo");
  add(sextaSanta.month,sextaSanta.day,"Sexta-feira Santa","Nacional");
  add(3,21,"Tiradentes","Nacional");
  add(4,1,"Dia do Trabalhador","Nacional");
  add(4,dMae,"Dia das Mães","Comemorativo");
  add(cc.month,cc.day,"Corpus Christi","Facultativo");
  add(5,24,"São João","Estadual");
  add(6,16,"N.S. do Carmo","Municipal");
  add(6,20,"🎂 Aniversário do Joaquim","Pessoal");
  add(6,27,"🎂 Aniversário do Eduardo","Pessoal");
  add(7,dPai,"Dia dos Pais","Comemorativo");
  add(8,7,"Independência","Nacional");
  add(8,28,"🎂 Aniversário da Raquel","Pessoal");
  add(9,12,"N.S. Aparecida / Crianças","Nacional");
  add(10,2,"Finados","Nacional");
  add(10,15,"Proclamação da República","Nacional");
  add(10,20,"Consciência Negra","Nacional");
  add(11,8,"Imaculada Conceição","Municipal");
  add(11,25,"Natal","Nacional");
  return hol;
}

// ===== BUILD BASE SCHEDULE =====
function buildBase(y){
  const s={},n={};
  const hol=buildHolidays(y);
  const ref=new Date(2026,3,10); // Fixed weekend reference: Apr 10, 2026 = Raquel
  const startK=y===2026?"2026-04-10":dk(y,0,1);
  const startM=y===2026?3:0;

  for(let m=startM;m<12;m++){for(let d=1;d<=dim(y,m);d++){
    const k=dk(y,m,d);
    if(k<startK)continue;

    // January vacation (2027+)
    if(y>=2027&&m===0){
      if(d<=15){s[k]=E;n[k]="🏖️ Férias — 1ª quinzena (pai)";continue;}
      else{s[k]=R;n[k]="🏖️ Férias — 2ª quinzena (mãe)";continue;}
    }

    // Regular weekly schedule
    const w=gdow(y,m,d);
    if(w===1||w===2){s[k]=R;n[k]="Regime semanal (Seg/Ter)";}
    else if(w===3||w===4){s[k]=E;n[k]="Regime semanal (Qua/Qui)";}
    else{
      let fri;
      if(w===5)fri=new Date(y,m,d);
      else if(w===6)fri=new Date(y,m,d-1);
      else fri=new Date(y,m,d-2);
      const diff=Math.round((fri-ref)/(7*86400000));
      s[k]=diff%2===0?R:E;
      n[k]="Fim de semana alternado";
    }
  }}

  // ===== FIXED DATES =====
  // Natal alternado: 2026=mãe(par), 2027=pai(ímpar)...
  const xKey=dk(y,11,25);
  if(s[xKey]!==undefined){
    s[xKey]=y%2===0?R:E;
    n[xKey]=`Natal — alternado (${y}: ${y%2===0?'mãe':'pai'})`;
  }
  // Ano Novo: oposto do Natal do ano anterior
  // Natal par=mãe → Ano Novo seguinte(ímpar)=pai | Natal ímpar=pai → Ano Novo seguinte(par)=mãe
  const nyKey=dk(y,0,1);
  if(s[nyKey]!==undefined&&y>=2027){
    s[nyKey]=y%2===0?R:E;
    n[nyKey]=`Ano Novo — alternado (${y}: ${y%2===0?'mãe':'pai'})`;
  }
  // Dia das Mães → fixo mãe
  const mdKey=Object.keys(hol).find(k=>hol[k].name==="Dia das Mães");
  if(mdKey&&s[mdKey]!==undefined){s[mdKey]=R;n[mdKey]="Dia das Mães — fixo com a mãe";}
  // Dia dos Pais → fixo pai
  const fdKey=Object.keys(hol).find(k=>hol[k].name==="Dia dos Pais");
  if(fdKey&&s[fdKey]!==undefined){s[fdKey]=E;n[fdKey]="Dia dos Pais — fixo com o pai";}
  // Aniversário Joaquim alternado: par=mãe, ímpar=pai
  const jbKey=dk(y,6,20);
  if(s[jbKey]!==undefined){
    s[jbKey]=y%2===0?R:E;
    n[jbKey]=`🎂 Aniv. Joaquim — alternado (${y}: ${y%2===0?'mãe':'pai'})`;
  }
  // Aniversário Eduardo → fixo pai
  const ebKey=dk(y,6,27);
  if(s[ebKey]!==undefined){s[ebKey]=E;n[ebKey]="🎂 Aniv. Eduardo — fixo com o pai";}
  // Aniversário Raquel → fixo mãe
  const rbKey=dk(y,8,28);
  if(s[rbKey]!==undefined){s[rbKey]=R;n[rbKey]="🎂 Aniv. Raquel — fixo com a mãe";}

  // ===== ALTERNATING HOLIDAYS =====
  const fixedSet=new Set([xKey,nyKey,mdKey,fdKey,jbKey,ebKey,rbKey]);
  const altList=Object.keys(hol).filter(k=>!fixedSet.has(k)&&s[k]!==undefined).sort();
  // Par: começa Raquel, Ímpar: começa Eduardo
  let turn=y%2===0;
  for(const k of altList){
    s[k]=turn?R:E;
    n[k]=(hol[k]?.name||"Feriado")+" — alternado";
    turn=!turn;
  }

  // ===== 2026: TROCAS ACORDADAS JUNHO =====
  // (trocas acordadas de junho/2026 ficam no histórico de trocas, não no base)

  return{s,n,hol};
}

// ===== YEAR MANAGEMENT =====
function loadYear(y,m){
  year=y;
  const res=buildBase(y);
  BASE=res.s;NOTES=res.n;HOL=res.hol;
  // Show cached changes right away while the server loads
  const lsKey=`gj${y%100}`;
  try{changes=JSON.parse(localStorage.getItem(lsKey+'_c')||'{}')}catch(e){changes={}}
  schedule={...BASE};
  for(const[k,v]of Object.entries(changes)){if(v&&v.to)schedule[k]=v.to;}
  month=m===undefined?getMinMonth():Math.max(getMinMonth(),m);
  editing=null;
  document.getElementById('yearLabel').textContent=y;
  document.getElementById('yearPrev').disabled=(y<=2026);
  document.title=`Guarda Joaquim · ${y}`;
  initFirebase();
}
function changeYear(d){
  const y=year+d;if(y<2026)return;
  const n=new Date();
  loadYear(y,y===n.getFullYear()?n.getMonth():undefined);
}
function prevMonth(){
  if(month>getMinMonth()){month--;slideDir='r';editing=null;render();}
  else if(year>2026){slideDir='r';loadYear(year-1,11);}
}
function nextMonth(){
  if(month<11){month++;slideDir='l';editing=null;render();}
  else{slideDir='l';loadYear(year+1,0);}
}

// ===== SUPABASE =====
const SUPABASE_URL='https://rmllgosztllefrzndutn.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtbGxnb3N6dGxsZWZyem5kdXRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0NzMyNDksImV4cCI6MjA5MDA0OTI0OX0.HB8iucvgv3--zW28EuW4_RGxNqPXgtFhZWIVM-ajf-Q';
const sb=window.supabase?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let subscription=null;

async function initFirebase(){
  if(subscription){sb.removeChannel(subscription);subscription=null;}
  const lsKey=`gj${year%100}`;
  syncState='loading';render();

  try{
    if(!sb)throw new Error('Supabase indisponível');
    // Load existing changes for this year
    const y0=year;
    const{data,error}=await sb.from('guarda_changes').select('*').eq('year',year);
    if(error)throw error;
    if(year!==y0)return;
    changes={};
    (data||[]).forEach(r=>{changes[r.date_key]={from:BASE[r.date_key],to:r.parent,by:r.changed_by||'?',at:r.changed_at,note:r.note||''};});
    schedule={...BASE};
    for(const[k,v]of Object.entries(changes)){schedule[k]=v.to;}
    localStorage.setItem(lsKey+'_s',JSON.stringify(schedule));
    localStorage.setItem(lsKey+'_c',JSON.stringify(changes));
    syncState='online';render();
    loadAvisos();

    // Subscribe to realtime changes
    subscription=sb.channel(`guarda_${year}`)
      .on('postgres_changes',{event:'*',schema:'public',table:'guarda_changes'},async()=>{
        const{data:d2}=await sb.from('guarda_changes').select('*').eq('year',year);
        changes={};
        (d2||[]).forEach(r=>{changes[r.date_key]={from:BASE[r.date_key],to:r.parent,by:r.changed_by||'?',at:r.changed_at,note:r.note||''};});
        schedule={...BASE};
        for(const[k,v]of Object.entries(changes)){schedule[k]=v.to;}
        localStorage.setItem(lsKey+'_s',JSON.stringify(schedule));
        localStorage.setItem(lsKey+'_c',JSON.stringify(changes));
        syncState='online';render();
      })
      
      .on('postgres_changes',{event:'*',schema:'public',table:'guarda_avisos'},()=>loadAvisos())
      .subscribe((status)=>{
        if(status==='SUBSCRIBED'){syncState='online';render();}
        else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'){syncState='offline';render();}
      });
  }catch(e){
    console.error('Supabase error:',e);
    syncState='offline';
    schedule=JSON.parse(localStorage.getItem(lsKey+'_s')||'null')||{...BASE};
    changes=JSON.parse(localStorage.getItem(lsKey+'_c')||'{}');
    for(const[k,v]of Object.entries(changes)){schedule[k]=v.to;}
    render();
  }
}

async function save(){
  const lsKey=`gj${year%100}`;
  localStorage.setItem(lsKey+'_s',JSON.stringify(schedule));
  localStorage.setItem(lsKey+'_c',JSON.stringify(changes));
  try{
    if(!sb)throw new Error('Supabase indisponível');
    // Build upsert rows from current changes
    const rows=Object.entries(changes).map(([k,v])=>({year,date_key:k,parent:v.to,note:v.note||'',changed_by:v.by&&v.by!=='?'?v.by:(localStorage.getItem('gj_user')||'?'),changed_at:v.at||new Date().toISOString()}));
    // Delete removed changes for this year, then upsert current
    const changedKeys=Object.keys(changes);
    const{data:existing}=await sb.from('guarda_changes').select('date_key').eq('year',year);
    const toDelete=(existing||[]).filter(r=>!changedKeys.includes(r.date_key)).map(r=>r.date_key);
    if(toDelete.length){await sb.from('guarda_changes').delete().eq('year',year).in('date_key',toDelete);}
    if(rows.length){await sb.from('guarda_changes').upsert(rows,{onConflict:'year,date_key'});}
    toast('✅ Sincronizado');
  }catch(e){
    console.error('Save error:',e);
    toast('⚠️ Salvo localmente');
  }
}
function swap(k){const cur=schedule[k];const nv=cur===R?E:cur===E?R:E;schedule[k]=nv;
  if(nv!==BASE[k])changes[k]={from:BASE[k],to:nv,by:localStorage.getItem('gj_user')||'?',at:new Date().toISOString()};else delete changes[k];save();editing=null;render();}
function undo(k){schedule[k]=BASE[k];delete changes[k];save();render();}
function resetAll(){if(!confirm('Tem certeza que deseja resetar todas as alterações de '+year+'?'))return;schedule={...BASE};changes={};save();editing=null;render();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);}

// ===== HELPERS =====
const clean=s=>(s||'').replace(/\p{Extended_Pictographic}️?\s*/gu,'').replace(/\s+—\s+(pai|mãe)\s*$/,'').trim();
const who=k=>schedule[k]===S?'shared':schedule[k]===R?'mae':'pai';
const whoName=k=>schedule[k]===S?'Ambos':schedule[k];
const DL=['D','S','T','Q','Q','S','S'];
const DFULL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const IC={
  edit:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  pin:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  plus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  left:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  right:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>'
};
function kind(note){note=note||'';return note.includes('fixo')?'fixo':note.includes('Férias')?'férias':note.includes('Troca')?'acordo':'alternado';}

function renderBell(){
  const el=document.getElementById('bell');if(!el)return;
  if(pushState==='hidden'){el.style.display='none';return;}
  el.style.display='';
  const on=pushState==='on';
  el.classList.toggle('on',on);
  el.innerHTML=`<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>`;
}
async function bellTap(){
  if(pushState==='off')return enablePush();
  if(pushState==='on')return testPush();
  if(pushState==='install')return alert('Para receber notificações no iPhone, abra o app pelo ícone da tela de início (Safari › Compartilhar › Adicionar à Tela de Início).');
  if(pushState==='denied')return alert('As notificações estão bloqueadas. Libere em Ajustes › Notificações › Joaquim.');
  if(pushState==='unsupported')return alert('Notificações precisam do iOS 16.4 ou mais novo.');
}
async function testPush(){
  try{
    const reg=await navigator.serviceWorker.ready;const sub=await reg.pushManager.getSubscription();
    if(!sub){pushState='off';render();return enablePush();}
    await saveSub(sub);
    toast('Enviando teste');
    const r=await fetch(FN_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'teste',endpoint:sub.endpoint})});
    const j=await r.json().catch(()=>({}));
    if(!(j.ok>0))toast('O teste falhou. Me avise.');
  }catch(e){console.error(e);toast('O teste falhou. Me avise.');}
}
function renderSync(){
  const el=document.getElementById('sync');
  el.className='sync '+syncState;
  el.querySelector('.sync-label').textContent=syncState==='online'?'Ao vivo':syncState==='loading'?'Conectando':'Offline';
}
function setUser(u){localStorage.setItem('gj_user',u);document.getElementById('who').classList.remove('open');checkPush();}

function getTotals(){
  let r=0,e=0,s=0;for(const[k,v]of Object.entries(schedule)){if(inR(k)){v===R?r++:v===E?e++:s++;}}
  let rO=0,eO=0;for(const[k,v]of Object.entries(BASE)){if(inR(k)){v===R?rO++:v===E?eO++:0;}}
  return{r,e,s,rD:r-rO,eD:e-eO,total:r+e+s};
}
function getMTotals(m){
  let r=0,e=0,s=0;for(let d=1;d<=dim(year,m);d++){const k=dk(year,m,d);if(!inR(k))continue;const v=schedule[k];v===R?r++:v===E?e++:s++;}
  return{r,e,s};
}

function renderTabs(){
  const btns=[...document.querySelectorAll('.tabbar button')];
  btns.forEach((b,i)=>{
    const on=b.dataset.tab===tab;b.classList.toggle('active',on);
    if(on)document.querySelector('.tabbar .pill').style.transform=`translateX(${i*100}%)`;
  });
  const cc=Object.keys(changes).length,bd=document.getElementById('altBadge');
  bd.textContent=cc;bd.style.display=cc?'':'none';

function renderCal(){

  const delta=n=>n?`<em class="${n>0?'up':'down'}">${n>0?'+':''}${n} com trocas</em>`:'';
  const bal=`<section class="glass card">
    <div class="bal-head"><span>Balanço de ${year}</span><span class="muted">${t.total} dias</span></div>
    <div class="bal-nums">
      <div class="bal mae"><b>${t.r}</b><span>Raquel · ${Math.round(pR)}%</span>${delta(t.rD)}</div>

    </div>
    <div class="bar"><i class="mae" style="width:${pR}%"></i>${t.s?`<i class="shared" style="width:${pS}%"></i>`:''}<i class="pai" style="width:${pE}%"></i></div>
    <p class="bal-foot${diff>5?' warn':''}">${diff===0?'Divisão exata':`Diferença de ${diff} ${diff===1?'dia':'dias'}`}</p>
  </section>`;

  const anim=slideDir?' slide-'+slideDir:'';slideDir='';
  const minDis=year<=2026&&month<=getMinMonth();
  let h=renderProx7()+`<section class="glass card" id="calcard">
    <div class="cal-top">
      <div><h2>${MO[month]}</h2><p class="muted">${year} · Raquel ${mt.r} · Eduardo ${mt.e}${mt.s?` · Ambos ${mt.s}`:''}</p></div>
      <div class="nav">
        <button class="circle" onclick="prevMonth()" ${minDis?'disabled':''} aria-label="Mês anterior">${IC.left}</button>
        <button class="circle" onclick="nextMonth()" aria-label="Próximo mês">${IC.right}</button>
      </div>
    </div>
    ${year>=2027&&month===0?`<div class="note">Férias de janeiro: dias 1 a 15 com Eduardo, 16 a 31 com Raquel.</div>`:''}
    <div class="wk">${DL.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="grid${anim}" id="grid">`;
  const first=gdow(year,month,1);
  for(let i=0;i<first;i++)h+='<span></span>';
  for(let d=1;d<=dim(year,month);d++){
    const k=dk(year,month,d);
    if(!inR(k)){h+=`<span class="d off">${d}</span>`;continue;}
    h+=`<button class="d ${who(k)}${k===td?' today':''}${editing===k?' sel':''}" onclick="openDay('${k}')">${d}${changes[k]?'<i class="chg"></i>':''}${dotsFor(k)}</button>`;
  }
  h+=`</div>
    <div class="legend"><span><i class="sw mae"></i>Raquel</span><span><i class="sw pai"></i>Eduardo</span><span><i class="pt hol"></i>Feriado</span><span><i class="pt av"></i>Aviso</span><span><i class="pt chg"></i>Trocado</span></div>
  </section>`;

  h+=bal+renderAvisosCard()+renderAgendaCard();

  h+=`<details class="glass card rules"><summary>Regras do acordo${IC.right}</summary><dl>
    <div><dt>Segunda e terça</dt><dd>Raquel</dd></div>
    <div><dt>Quarta e quinta</dt><dd>Eduardo</dd></div>
    <div><dt>Sexta a domingo</dt><dd>Alternados</dd></div>
    ${year>=2027?'<div><dt>Férias de janeiro</dt><dd>1–15 Eduardo · 16–31 Raquel</dd></div>':''}
    <div><dt>Natal ${year}</dt><dd>${par}</dd></div>
    <div><dt>Ano Novo ${year}</dt><dd>${par}</dd></div>
    <div><dt>Aniversário do Joaquim</dt><dd>${par} em ${year}</dd></div>

    <div><dt>Demais feriados</dt><dd>Alternam a cada ano</dd></div>

// ===== AVISOS =====
const TIPOS={escola:'Escola',saude:'Saúde',festa:'Festa',atividade:'Atividade',casa:'Casa',outro:'Outro'};
const EXEMPLO={escola:'Ex.: ir de roupa branca',saude:'Ex.: pediatra, Dra. Ana',festa:'Ex.: aniversário do Pedro',atividade:'Ex.: natação',casa:'Ex.: férias da Amanda',outro:'Ex.: buscar mais cedo'};
const DSHORT=['dom','seg','ter','qua','qui','sex','sáb'];
const avEnd=a=>a.date_end||a.date_key;
const isRec=a=>Array.isArray(a.dias_semana)&&a.dias_semana.length>0;
const dowK=k=>new Date(k+'T12:00:00').getDay();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy=k=>`${parseInt(k.slice(8))}/${parseInt(k.slice(5,7))}`;
const horas=a=>a.hora?(a.hora_fim?`${a.hora}–${a.hora_fim}`:a.hora):'';
function addDays(k,n){const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dk(d.getFullYear(),d.getMonth(),d.getDate());}
function diasTxt(ds){const n=[...ds].sort().map(d=>DSHORT[d]);return n.length>1?n.slice(0,-1).join(', ')+' e '+n[n.length-1]:n[0];}
function ocorre(a,k){
  if(k<a.date_key||k>avEnd(a))return false;
  if(!isRec(a))return true;
  return a.dias_semana.includes(dowK(k))&&!(a.excecoes||[]).includes(k);
}
const avisosDo=k=>AV.filter(a=>ocorre(a,k)).sort((x,y)=>(x.hora||'').localeCompare(y.hora||''));
function proxOcorrencia(a,from){for(let i=0;i<400;i++){const k=addDays(from,i);if(k>avEnd(a))return null;if(ocorre(a,k))return k;}return null;}
function dotsFor(k){
  const h=HOL[k],a=AV.some(x=>!isRec(x)&&ocorre(x,k));
  return (h||a)?`<span class="dots">${h?'<i class="h"></i>':''}${a?'<i class="a"></i>':''}</span>`:'';
}

async function loadAvisos(){

function avRow(a,inSheet,dayK){
  const per=!isRec(a)&&avEnd(a)!==a.date_key,h=horas(a);
  const meta=[`<span class="tp ${esc(a.tipo||'outro')}">${TIPOS[a.tipo]||'Outro'}</span>`];
  if(isRec(a))meta.push(`até ${dmy(avEnd(a))}`);
  else if(per)meta.push(`${dmy(a.date_key)} a ${dmy(avEnd(a))}`);
  if(h)meta.push(esc(h));
  if(a.local&&!inSheet)meta.push(esc(a.local));
  meta.push('por '+esc(a.created_by));
  if(a.alerta===false)meta.push('sem alerta');
  const loc=inSheet&&a.local?`<a class="loc" href="https://maps.apple.com/?q=${encodeURIComponent(a.local)}" target="_blank" rel="noopener">${IC.pin}${esc(a.local)}</a>`:'';
  const main=`<div class="av-main"><p>${esc(a.texto)}</p>${loc}<div class="av-meta">${meta.join('<span>·</span>')}</div>`;
  if(inSheet){
    const pend=pendDel&&pendDel.id===a.id;
    return `<div class="av-row">${main}${pend?`<div class="del-opts">
        <button class="small-btn" onclick="skipDay(${a.id},'${dayK}')">Só neste dia</button>
        <button class="small-btn danger" onclick="removeAviso(${a.id})">Toda a série</button>
        <button class="small-btn" onclick="pendDel=null;render()">Manter</button></div>`:''}</div>
      ${pend?'':`<div class="row-acts"><button class="x" onclick="openEdit(${a.id})" aria-label="Editar aviso">${IC.edit}</button><button class="x" onclick="askDel(${a.id})" aria-label="Apagar aviso">${IC.x}</button></div>`}</div>`;
  }
  const td=today(),amanha=addDays(td,1);
  let b,sp,alvo;
  if(isRec(a)){b='Semanal';sp=diasTxt(a.dias_semana);alvo=proxOcorrencia(a,td)||a.date_key;}
  else if(a.date_key<td){b='Agora';sp='até '+dmy(avEnd(a));alvo=td;}
  else{
    b=`${parseInt(a.date_key.slice(8))} ${MO[parseInt(a.date_key.slice(5,7))-1].slice(0,3).toLowerCase()}`;
    sp=a.date_key===td?'hoje':a.date_key===amanha?'amanhã':DFULL[dowK(a.date_key)].toLowerCase();
    alvo=a.date_key;
  }
  return `<button class="av-row" onclick="openDayAny('${alvo}')"><div class="av-when"><b>${b}</b><span>${sp}</span></div>${main}</div></button>`;
}

function renderAvisosCard(){

function renderProx7(){
  const td=today(),lim=addDays(td,7),am=addDays(td,1);
  const itens=[];
  for(const a of AV){
    if(isRec(a))continue;
    if(a.date_key<=lim&&avEnd(a)>=td)itens.push({a,k:a.date_key<td?td:a.date_key,ongoing:a.date_key<td});
  }
  if(!itens.length)return '';
  itens.sort((x,y)=>x.k.localeCompare(y.k)||(x.a.hora||'').localeCompare(y.a.hora||''));
  const rows=itens.slice(0,5).map(({a,k,ongoing})=>{
    let w;
    if(ongoing)w='Até '+dmy(avEnd(a));
    else if(k===td)w='Hoje';
    else if(k===am)w='Amanhã';
    else{const d=new Date(k+'T12:00:00');w=DA[d.getDay()]+' '+d.getDate();}
    const h=avEnd(a)===a.date_key||isRec(a)?horas(a):'';
    return `<button class="prox-row" onclick="openDayAny('${k}')"><span class="when">${w}</span><span class="t"><span class="tp ${esc(a.tipo||'outro')}"></span> ${esc(a.texto)}</span>${h?`<span class="hr">${esc(h)}</span>`:''}</button>`;
  }).join('');
  return `<section class="glass prox">${rows}${itens.length>5?`<p class="av-more" style="padding:0 0 10px">E mais ${itens.length-5} nesta semana</p>`:''}</section>`;
}

    <div class="sh-head"><h3>${form.editId?'Editar aviso':'Novo aviso'}</h3><button class="x" onclick="closeForm()" aria-label="Fechar">${IC.x}</button></div>
    <p class="f-label">Tipo</p>
    <div class="chips" id="fTipo">${Object.entries(TIPOS).map(([t,v])=>`<button class="chip${t===form.tipo?' on':''}" data-t="${t}" onclick="pickTipo('${t}')">${v}</button>`).join('')}</div>
    <p class="f-label">O que é</p>
    <input class="field" id="fTxt" maxlength="200" placeholder="${EXEMPLO[form.tipo]}" enterkeyhint="done" autocomplete="off">
    <p class="f-label">Local (opcional)</p>
    <input class="field" id="fLocal" maxlength="200" placeholder="Ex.: Buffet Espaço Kids, Boa Viagem" enterkeyhint="done" autocomplete="off">
    <p class="f-label">Quando</p>
    <div class="seg" id="fModo">
      <button data-m="um" class="on" onclick="setModo('um')">Um dia</button>
      <button data-m="varios" onclick="setModo('varios')">Vários dias</button>
      <button data-m="semana" onclick="setModo('semana')">Toda semana</button>
    </div>
    <div id="fDiasW" style="display:none"><div class="chips days" id="fDias" style="margin-top:12px">${['D','S','T','Q','Q','S','S'].map((l,i)=>`<button class="chip day" data-d="${i}" onclick="toggleDia(${i})" aria-label="${DFULL[i]}">${l}</button>`).join('')}</div></div>
    <div class="f-row">
      <label><small id="fIniL">Dia</small><input class="field" type="date" id="fIni" value="${form.date_key}"></label>
      <label id="fFimW" style="display:none"><small>Até</small><input class="field" type="date" id="fFim"></label>
    </div>
    <div class="f-row" id="fHorasW">
      <label><small>Início (opcional)</small><input class="field" type="time" id="fHora"></label>
      <label><small>Fim (opcional)</small><input class="field" type="time" id="fHoraFim"></label>
    </div>
    <div class="toggle"><span>Notificar<small id="fAlHint">${form.editId?'Lembra os dois na véspera, às 19h.':`Avisa ${outro} agora e os dois na véspera, às 19h.`}</small></span><button class="sw-t on" id="fAl" onclick="toggleAl()" aria-label="Notificar"></button></div>
    <div class="sh-actions"><button class="btn av" id="fSave" onclick="saveAviso()">${form.editId?'Salvar alterações':'Salvar aviso'}</button><button class="btn ghost" onclick="closeForm()">Cancelar</button>${form.editId?`<button class="btn del" onclick="delFromForm()">Apagar aviso</button>`:''}</div>`;
}
function pickTipo(t){
  form.tipo=t;
  document.querySelectorAll('#fTipo .chip').forEach(c=>c.classList.toggle('on',c.dataset.t===t));
  document.getElementById('fTxt').placeholder=EXEMPLO[t];
}
function setModo(m){
  form.modo=m;
  document.querySelectorAll('#fModo button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  document.getElementById('fDiasW').style.display=m==='semana'?'':'none';
  document.getElementById('fFimW').style.display=m==='um'?'none':'';
  document.getElementById('fHorasW').style.display=m==='varios'?'none':'';
  document.getElementById('fIniL').textContent=m==='um'?'Dia':'De';
  const ini=document.getElementById('fIni').value||today(),fim=document.getElementById('fFim');
  if(m==='varios'&&(!fim.value||fim.value<=ini))fim.value=addDays(ini,1);
  if(m==='semana'&&(!fim.value||fim.value<=ini))fim.value=ini.slice(0,4)+'-12-31';
  // atividades da semana costumam não precisar de alerta
  setAlerta(m!=='semana');
}
function toggleDia(i){
  const s=new Set(form.dias);s.has(i)?s.delete(i):s.add(i);form.dias=[...s].sort();
  document.querySelectorAll('#fDias .chip').forEach(c=>c.classList.toggle('on',form.dias.includes(+c.dataset.d)));
}
function setAlerta(v){form.alerta=v;document.getElementById('fAl').classList.toggle('on',v);}
function toggleAl(){setAlerta(!form.alerta);}
async function saveAviso(){
  const txt=document.getElementById('fTxt').value.trim();
  const ini=document.getElementById('fIni').value;
  const m=form.modo;
  let fim=m==='um'?null:document.getElementById('fFim').value;
  if(!txt){toast('Escreva o aviso');document.getElementById('fTxt').focus();return;}
  if(!ini){toast('Escolha o dia');return;}
  if(m!=='um'&&!fim){toast('Escolha até quando');return;}
  if(fim&&fim<ini){toast('A data final vem antes da inicial');return;}
  if(m==='semana'&&!form.dias.length){toast('Escolha os dias da semana');return;}
  if(m==='varios'&&fim===ini)fim=null;
  const hv=document.getElementById('fHora').value,hf=document.getElementById('fHoraFim').value;
  const comHora=m!=='varios'&&hv;
  const row={date_key:ini,date_end:fim,hora:comHora?hv.slice(0,5):null,hora_fim:comHora&&hf?hf.slice(0,5):null,
    dias_semana:m==='semana'?form.dias:null,alerta:form.alerta,tipo:form.tipo,texto:txt.slice(0,200),
    created_by:localStorage.getItem('gj_user')||'?'};
  const lv=document.getElementById('fLocal').value.trim();row.local=lv?lv.slice(0,200):null;
  if(!sb){toast('Sem conexão agora');return;}
  if(form.editId){
    const id=form.editId;delete row.created_by;
    const btn=document.getElementById('fSave');btn.disabled=true;btn.textContent='Salvando';
    const{error}=await sb.from('guarda_avisos').update(row).eq('id',id);
    if(error){console.error(error);toast('Não foi possível salvar');btn.disabled=false;btn.textContent='Salvar alterações';return;}
    AV=AV.map(a=>a.id===id?{...a,...row}:a);
    form=null;toast('Aviso atualizado');
    openDayAny(row.dias_semana?(proxOcorrencia({...row,excecoes:[]},today())||row.date_key):row.date_key);
    loadAvisos();return;
  }
  const btn=document.getElementById('fSave');btn.disabled=true;btn.textContent='Salvando';
  const{error}=await sb.from('guarda_avisos').insert(row);
  if(error){console.error(error);toast('Não foi possível salvar');btn.disabled=false;btn.textContent='Salvar aviso';return;}
  form=null;toast('Aviso salvo');
  AV=[...AV,{...row,excecoes:[],id:-Date.now()}].sort((a,b)=>a.date_key.localeCompare(b.date_key));
  render();loadAvisos();
}

// ===== NOTIFICAÇÕES PUSH =====
const VAPID_PUB='BBI2x9NMyHjsxlFuGRnH6duiBjEdf_bx6f1nU61u0grZ0C_gfKiRsBBjri8sWEhGJrz7vghmeHzeejoogp_brrY';
const FN_URL=SUPABASE_URL+'/functions/v1/avisos-push';
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent);
function b64u(s){const p='='.repeat((4-s.length%4)%4);const b=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(b,c=>c.charCodeAt(0));}
async function saveSub(sub){
  const j=sub.toJSON();
  if(!sb)return;
  const{error}=await sb.rpc('save_push_sub',{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_user:localStorage.getItem('gj_user')||'?'});
  if(error)console.error(error);
}
async function checkPush(){
  const ok='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
  if(!ok){pushState=isIOS()&&!isStandalone()?'install':(isStandalone()?'unsupported':'hidden');render();return;}
  if(Notification.permission==='denied'){pushState='denied';render();return;}
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    pushState=sub?'on':'off';
    if(sub)saveSub(sub);
  }catch(e){console.error(e);pushState='hidden';}
  render();
}
async function enablePush(btn){
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){pushState=perm==='denied'?'denied':'off';render();return;}
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUB)});
    await saveSub(sub);
    pushState='on';render();toast('Notificações ativadas');
    fetch(FN_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mode:'teste',endpoint:sub.endpoint})}).catch(()=>{});
  }catch(e){console.error(e);toast('Não foi possível ativar');}
}

// Teclado do iPhone: mantém o painel acima do teclado
if(window.visualViewport){
  const vv=window.visualViewport;
  const fix=()=>{const sh=document.getElementById('sheet');const kb=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
    if(kb>80){sh.style.bottom=(kb+8)+'px';sh.style.maxHeight=(vv.height-16)+'px';}else{sh.style.bottom='';sh.style.maxHeight='';}};
  vv.addEventListener('resize',fix);vv.addEventListener('scroll',fix);
}

// ===== ATUALIZAÇÃO AUTOMÁTICA =====
const BUILD='20261017103806';
async function checkVersion(){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    const j=await r.json();
    if(j.build&&j.build!==BUILD&&!form)location.reload();
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkVersion();});

// ===== INÍCIO =====
let slideDir='',lastTab=null,form=null,pushState='hidden';
let AV=[];try{AV=JSON.parse(localStorage.getItem('gj_av')||'[]')}catch(e){AV=[]}
const now=new Date();
const iy=Math.max(2026,now.getFullYear());
const qd=new URLSearchParams(location.search).get('d');
if(qd&&/^\d{4}-\d{2}-\d{2}$/.test(qd)){
  loadYear(Math.max(2026,parseInt(qd.slice(0,4))),parseInt(qd.slice(5,7))-1);
  editing=qd;render();
  history.replaceState(null,'',location.pathname);
}else loadYear(iy,iy===now.getFullYear()?now.getMonth():undefined);
if(!localStorage.getItem('gj_user'))document.getElementById('who').classList.add('open');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>checkPush()).catch(e=>{console.error(e);checkPush();});
else checkPush();
checkVersion();
</script>
